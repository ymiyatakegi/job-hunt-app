<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>脳内メモ</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #6c7688;
      --line: #dce2eb;
      --accent: #246bfe;
      --accent-ink: #ffffff;
      --danger: #c93636;
      --shadow: 0 16px 40px rgba(23, 32, 51, 0.10);
      --note-color: #d9e8ff;
    }

    * { box-sizing: border-box; }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: #eef2f8;
      min-height: 0;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .primary {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .filter-category-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 43px;
      gap: 8px;
      align-items: center;
    }

    .icon-add {
      width: 43px;
      height: 43px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .quick-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px 58px;
      gap: 8px;
      align-items: center;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: #ffffff;
      color: var(--ink);
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.14);
    }

    .memo-list {
      display: grid;
      gap: 8px;
      align-content: start;
      grid-auto-rows: max-content;
      overflow: auto;
      flex: 1 1 auto;
      min-height: 160px;
      padding-right: 2px;
    }

    .memo-item {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 6px 18px rgba(23, 32, 51, 0.05);
      overflow: hidden;
    }

    .memo-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 107, 254, 0.13);
    }

    .memo-button {
      min-width: 0;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 12px 12px 12px 0;
      color: inherit;
    }

    .memo-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
      font-size: 14px;
    }

    .memo-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(12px);
      min-width: 0;
    }

    .topbar > div:first-child {
      min-width: 0;
    }

    #currentName, #currentMeta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .editor-wrap {
      overflow: auto;
      min-height: 0;
      padding: 18px;
    }

    .editor {
      display: grid;
      gap: 16px;
      align-content: start;
      grid-auto-rows: max-content;
      width: 100%;
      min-height: 0;
      margin: 0;
      border: 1px solid color-mix(in srgb, var(--note-color) 65%, var(--line));
      border-top: 12px solid var(--note-color);
      border-radius: 8px;
      padding: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .editor-empty {
      display: grid;
      place-items: center;
      min-height: 240px;
      color: var(--muted);
      text-align: center;
    }

    .api-result {
      width: 100%;
      margin: 0 0 16px;
      border: 1px solid var(--line);
      border-left: 8px solid var(--accent);
      border-radius: 8px;
      padding: 14px 16px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
      white-space: pre-wrap;
      line-height: 1.68;
    }

    .prompt-builder {
      display: grid;
      gap: 14px;
      width: 100%;
      margin: 0 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
    }

    .prompt-builder-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .prompt-builder-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .prompt-blocks {
      display: grid;
      gap: 12px;
    }

    .prompt-block {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcff;
    }

    .prompt-block-tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .prompt-separator {
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }

    .prompt-output {
      min-height: 220px;
      resize: vertical;
      white-space: pre-wrap;
      line-height: 1.65;
    }

    .title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
      gap: 14px;
      align-items: end;
    }

    .title-input {
      font-size: 26px;
      font-weight: 900;
      padding: 11px 12px;
    }

    .category-row {
      display: grid;
      grid-template-columns: minmax(180px, 280px) minmax(180px, 1fr) 92px 118px;
      gap: 10px;
      align-items: end;
    }

    .color-chip {
      width: 100%;
      height: 43px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--note-color);
    }

    textarea.description {
      min-height: 88px;
      resize: vertical;
    }

    textarea.body {
      min-height: 260px;
      height: 320px;
      resize: vertical;
      line-height: 1.72;
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    }

    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      background: var(--panel);
    }

    .counts {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .secondary, .danger {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      background: #ffffff;
      color: var(--ink);
      font-weight: 700;
      white-space: nowrap;
    }

    .danger {
      color: var(--danger);
    }

    .copy {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      background: #101828;
      color: #ffffff;
      font-weight: 800;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      border-radius: 8px;
      padding: 11px 14px;
      background: #101828;
      color: #ffffff;
      box-shadow: var(--shadow);
      transition: 160ms ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 860px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .sidebar {
        min-height: auto;
        overflow: visible;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .memo-list {
        max-height: 280px;
      }

      .title-row, .category-row {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .editor-wrap {
        padding: 14px;
      }

      .editor {
        min-height: auto;
        padding: 14px;
      }

      .title-input {
        font-size: 21px;
      }

      .editor-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        justify-content: stretch;
      }

      .actions button {
        flex: 1 1 140px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>脳内メモ</h1>
        <button class="primary" id="newMemo">新規メモ</button>
      </div>

      <section class="filters" aria-label="メモ絞り込み">
        <div class="field">
          <label for="searchBox">検索</label>
          <input id="searchBox" type="search" placeholder="タイトル・用途・文面">
        </div>
        <div class="field">
          <label for="filterCategory">色分けで絞り込み</label>
          <div class="filter-category-row">
            <select id="filterCategory"></select>
            <button class="icon-add" id="toggleFilterCategoryAdd" title="色分けを追加" aria-label="色分けを追加">+</button>
          </div>
          <div class="quick-add" id="filterCategoryAdd" hidden>
            <input id="filterCategoryName" placeholder="新しい色分け">
            <input id="filterCategoryColor" type="color" value="#d9e8ff" aria-label="色選択">
            <button class="secondary" id="addFilterCategory">追加</button>
          </div>
        </div>
        <div class="field">
          <label for="sortMode">並び替え</label>
          <select id="sortMode">
            <option value="updatedDesc">更新日が新しい順</option>
            <option value="updatedAsc">更新日が古い順</option>
            <option value="countDesc">更新回数が多い順</option>
            <option value="titleAsc">タイトル順</option>
          </select>
        </div>
      </section>

      <nav class="memo-list" id="memoList" aria-label="メモ一覧"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <strong id="currentName">メモを選択してください</strong>
          <div class="status" id="currentMeta">保存先: このブラウザ</div>
        </div>
        <div class="topbar-actions">
          <button class="primary" id="promptBuilderOpen">プロンプト作成</button>
          <div class="status" id="saveStatus">自動保存</div>
        </div>
      </header>

      <div class="editor-wrap">
        <section class="prompt-builder" id="promptBuilder" hidden>
          <div class="prompt-builder-head">
            <h2>プロンプト作成</h2>
            <div class="actions">
              <button class="secondary" id="promptShowAll">全体を表示</button>
              <button class="secondary" id="promptBuilderClose">閉じる</button>
            </div>
          </div>

          <div class="prompt-blocks" id="promptBlocks"></div>
          <button class="secondary" id="promptExtend">＋プロンプトを延長</button>

          <div class="field" id="promptOutputWrap" hidden>
            <label for="promptOutput">全体</label>
            <textarea class="prompt-output" id="promptOutput" readonly></textarea>
            <div class="actions">
              <button class="copy" id="promptCopy">そのままコピー</button>
              <button class="secondary" id="promptDownload">txt保存</button>
            </div>
          </div>
        </section>

        <section class="editor-empty" id="emptyState">
          <div>左の「新規メモ」から作成できます。</div>
        </section>

        <section class="editor" id="editor" hidden>
          <div class="title-row">
            <div class="field">
              <label for="titleInput">タイトル</label>
              <input class="title-input" id="titleInput" placeholder="メモのタイトル">
            </div>
            <div class="field">
              <label for="updatedAt">更新日時</label>
              <input id="updatedAt" readonly>
            </div>
          </div>

          <div class="field">
            <label for="descriptionInput">用途説明</label>
            <textarea class="description" id="descriptionInput" placeholder="このメモを何に使うか"></textarea>
          </div>

          <div class="category-row">
            <div class="field">
              <label for="categorySelect">色分け</label>
              <select id="categorySelect"></select>
            </div>
            <div class="field">
              <label for="newCategoryName">新しく追加</label>
              <input id="newCategoryName" placeholder="例: 面接回答">
            </div>
            <div class="field">
              <label for="newCategoryColor">色選択</label>
              <input id="newCategoryColor" type="color" value="#d9e8ff">
            </div>
            <button class="secondary" id="addCategory">追加</button>
          </div>

          <div class="color-chip" id="colorPreview" title="このメモの色"></div>

          <div class="field">
            <label for="bodyInput">文面</label>
            <textarea class="body" id="bodyInput" placeholder="AIにそのまま挿入したいプロンプト、考え、文章"></textarea>
          </div>

          <footer class="editor-footer">
            <div class="counts">
              <span id="charCount">0文字</span>
              <span id="lineCount">0行</span>
              <span id="updateCount">更新0回</span>
              </div>
              <div class="actions">
                <button class="danger" id="deleteMemo">削除</button>
                <button class="primary" id="commitUpdate">更新</button>
                <button class="secondary" id="copyAll">全文コピー</button>
                <button class="copy" id="copyBody">文面をそのままコピー</button>
              </div>
          </footer>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORE_KEY = "nounai-memo-v1";
    const DEFAULT_CATEGORIES = [
      { id: "es", name: "ESエピソード", color: "#d9e8ff" },
      { id: "eval", name: "評価メモ", color: "#ffe3c7" }
    ];

    const $ = (id) => document.getElementById(id);
    const state = loadState();
    let activeId = state.memos[0]?.id || null;
    let promptParts = [];
    let saveTimer = null;

    const fields = {
      searchBox: $("searchBox"),
      filterCategory: $("filterCategory"),
      toggleFilterCategoryAdd: $("toggleFilterCategoryAdd"),
      filterCategoryAdd: $("filterCategoryAdd"),
      filterCategoryName: $("filterCategoryName"),
      filterCategoryColor: $("filterCategoryColor"),
      addFilterCategory: $("addFilterCategory"),
      sortMode: $("sortMode"),
      memoList: $("memoList"),
      editor: $("editor"),
      emptyState: $("emptyState"),
      currentName: $("currentName"),
      currentMeta: $("currentMeta"),
      saveStatus: $("saveStatus"),
      titleInput: $("titleInput"),
      updatedAt: $("updatedAt"),
      descriptionInput: $("descriptionInput"),
      categorySelect: $("categorySelect"),
      newCategoryName: $("newCategoryName"),
      newCategoryColor: $("newCategoryColor"),
      addCategory: $("addCategory"),
      colorPreview: $("colorPreview"),
      bodyInput: $("bodyInput"),
      charCount: $("charCount"),
      lineCount: $("lineCount"),
      updateCount: $("updateCount"),
      commitUpdate: $("commitUpdate"),
      promptBuilderOpen: $("promptBuilderOpen"),
      promptBuilderClose: $("promptBuilderClose"),
      promptBuilder: $("promptBuilder"),
      promptBlocks: $("promptBlocks"),
      promptExtend: $("promptExtend"),
      promptShowAll: $("promptShowAll"),
      promptCopy: $("promptCopy"),
      promptDownload: $("promptDownload"),
      promptOutputWrap: $("promptOutputWrap"),
      promptOutput: $("promptOutput"),
      toast: $("toast")
    };

    function uid(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORE_KEY));
        if (parsed?.memos && parsed?.categories) return parsed;
      } catch (_) {}
      return {
        categories: DEFAULT_CATEGORIES,
        memos: [
          createMemo("AI用プロンプト保管", "よく使うプロンプトや思考メモをここに保存します。", "ここに文面を書きます。", "es")
        ]
      };
    }

    function saveState() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      fields.saveStatus.textContent = "保存済み";
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => fields.saveStatus.textContent = "自動保存", 1200);
    }

    function createMemo(title = "無題メモ", description = "", body = "", categoryId = state?.categories?.[0]?.id || "es") {
      const now = new Date().toISOString();
      return {
        id: uid("memo"),
        title,
        description,
        body,
        categoryId,
        createdAt: now,
        updatedAt: now,
        updateCount: 0
      };
    }

    function activeMemo() {
      return state.memos.find((memo) => memo.id === activeId) || null;
    }

    function categoryById(id) {
      return state.categories.find((category) => category.id === id) || state.categories[0];
    }

    function formatDate(iso) {
      const date = new Date(iso);
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function renderCategoryOptions() {
      const options = state.categories
        .map((category) => `<option value="${escapeHtml(category.id)}">${escapeHtml(category.name)}</option>`)
        .join("");
      fields.categorySelect.innerHTML = options;
      fields.filterCategory.innerHTML = `<option value="all">すべて</option>${options}`;
    }

    function filteredMemos() {
      const query = fields.searchBox.value.trim().toLowerCase();
      const categoryId = fields.filterCategory.value;
      const sortMode = fields.sortMode.value;
      return state.memos
        .filter((memo) => categoryId === "all" || memo.categoryId === categoryId)
        .filter((memo) => {
          if (!query) return true;
          return [memo.title, memo.description, memo.body].join("\n").toLowerCase().includes(query);
        })
        .sort((a, b) => {
          if (sortMode === "updatedAsc") return new Date(a.updatedAt) - new Date(b.updatedAt);
          if (sortMode === "countDesc") return b.updateCount - a.updateCount;
          if (sortMode === "titleAsc") return a.title.localeCompare(b.title, "ja");
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        });
    }

    function renderList() {
      const memos = filteredMemos();
      fields.memoList.innerHTML = memos.length
        ? memos.map((memo) => {
            const category = categoryById(memo.categoryId);
            return `
              <article class="memo-item ${memo.id === activeId ? "active" : ""}">
                <div style="background:${escapeAttr(category.color)}"></div>
                <button class="memo-button" data-id="${escapeAttr(memo.id)}">
                  <div class="memo-title">${escapeHtml(memo.title || "無題メモ")}</div>
                  <div class="memo-meta">
                    <span>${escapeHtml(formatDate(memo.updatedAt))}</span>
                    <span>${memo.updateCount}回</span>
                  </div>
                </button>
              </article>
            `;
          }).join("")
        : `<div class="status">条件に合うメモがありません。</div>`;
    }

    function renderEditor() {
      const memo = activeMemo();
      fields.editor.hidden = !memo;
      fields.emptyState.hidden = Boolean(memo);
      if (!memo) {
        fields.currentName.textContent = "メモを選択してください";
        fields.currentMeta.textContent = "保存先: このブラウザ";
        return;
      }
      const category = categoryById(memo.categoryId);
      fields.editor.style.setProperty("--note-color", category.color);
      fields.titleInput.value = memo.title;
      fields.updatedAt.value = formatDate(memo.updatedAt);
      fields.descriptionInput.value = memo.description;
      fields.categorySelect.value = memo.categoryId;
      fields.bodyInput.value = memo.body;
      fields.colorPreview.style.background = category.color;
      fields.currentName.textContent = memo.title || "無題メモ";
      fields.currentMeta.textContent = `${category.name} / 更新 ${formatDate(memo.updatedAt)}`;
      updateCounts();
    }

    function renderAll() {
      renderCategoryOptions();
      renderList();
      renderEditor();
    }

    function updateCounts() {
      const memo = activeMemo();
      const body = fields.bodyInput.value;
      fields.charCount.textContent = `${body.length}文字`;
      fields.lineCount.textContent = `${body ? body.split(/\r\n|\r|\n/).length : 0}行`;
      fields.updateCount.textContent = `更新${memo?.updateCount || 0}回`;
    }

    function mutateActive(changes) {
      const memo = activeMemo();
      if (!memo) return;
      Object.assign(memo, changes);
      saveState();
      renderList();
      renderEditorHeader();
      updateCounts();
    }

    function commitActiveUpdate() {
      const memo = activeMemo();
      if (!memo) return;
      memo.updatedAt = new Date().toISOString();
      memo.updateCount += 1;
      saveState();
      renderList();
      renderEditor();
      showToast("更新しました");
    }

    function renderEditorHeader() {
      const memo = activeMemo();
      if (!memo) return;
      const category = categoryById(memo.categoryId);
      fields.editor.style.setProperty("--note-color", category.color);
      fields.colorPreview.style.background = category.color;
      fields.currentName.textContent = memo.title || "無題メモ";
      fields.currentMeta.textContent = `${category.name} / 更新 ${formatDate(memo.updatedAt)}`;
    }

    function addMemo() {
      const selectedFilter = fields.filterCategory.value;
      const categoryId = selectedFilter && selectedFilter !== "all" ? selectedFilter : state.categories[0]?.id;
      const memo = createMemo("無題メモ", "", "", categoryId);
      state.memos.unshift(memo);
      activeId = memo.id;
      saveState();
      renderAll();
      fields.titleInput.focus();
      fields.titleInput.select();
    }

    function addCategory() {
      const category = createCategory(fields.newCategoryName.value, fields.newCategoryColor.value);
      if (!category) return;
      state.categories.push(category);
      fields.newCategoryName.value = "";
      const memo = activeMemo();
      if (memo) {
        memo.categoryId = category.id;
      }
      saveState();
      renderAll();
    }

    function addFilterCategory() {
      const category = createCategory(fields.filterCategoryName.value, fields.filterCategoryColor.value);
      if (!category) return;
      state.categories.push(category);
      fields.filterCategoryName.value = "";
      fields.filterCategory.value = category.id;
      saveState();
      renderAll();
      fields.filterCategory.value = category.id;
      renderList();
      showToast("色分けを追加しました");
    }

    function createCategory(rawName, color) {
      const name = rawName.trim();
      if (!name) {
        showToast("色分け名を入力してください");
        return null;
      }
      if (state.categories.some((category) => category.name === name)) {
        showToast("同じ名前の色分けがあります");
        return null;
      }
      return {
        id: uid("cat"),
        name,
        color
      };
    }

    function deleteMemo() {
      const memo = activeMemo();
      if (!memo) return;
      if (!confirm(`「${memo.title || "無題メモ"}」を削除しますか？`)) return;
      state.memos = state.memos.filter((item) => item.id !== memo.id);
      activeId = state.memos[0]?.id || null;
      saveState();
      renderAll();
    }

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
      }
      showToast(message);
    }

    function copyAll() {
      const memo = activeMemo();
      if (!memo) return;
      const category = categoryById(memo.categoryId);
      copyText([
        `タイトル: ${memo.title}`,
        `用途説明: ${memo.description}`,
        `色分け: ${category.name}`,
        `更新日時: ${formatDate(memo.updatedAt)}`,
        "",
        memo.body
      ].join("\n"), "メモ全体をコピーしました");
    }

    function copyBody() {
      const memo = activeMemo();
      if (!memo) return;
      copyText(memo.body, "文面をそのままコピーしました");
    }

    function openPromptBuilder() {
      fields.promptBuilder.hidden = !fields.promptBuilder.hidden;
      if (!fields.promptBuilder.hidden && !promptParts.length) {
        addPromptPart();
      }
    }

    function closePromptBuilder() {
      fields.promptBuilder.hidden = true;
    }

    function addPromptPart() {
      promptParts.push({ id: uid("part"), type: "", memoId: "", text: "" });
      renderPromptBuilder();
    }

    function renderPromptBuilder() {
      fields.promptBlocks.innerHTML = promptParts.map((part, index) => {
        const separator = index < promptParts.length - 1 ? `<div class="prompt-separator"></div>` : "";
        return `
          <div class="prompt-block" data-part-id="${escapeAttr(part.id)}">
            <div class="prompt-block-tools">
              <button class="secondary" data-action="memo">＋メモを挿入</button>
              <button class="secondary" data-action="text">＋テキストを記入</button>
              <button class="danger" data-action="remove">削除</button>
            </div>
            ${renderPromptPartInput(part)}
          </div>
          ${separator}
        `;
      }).join("");
    }

    function renderPromptPartInput(part) {
      if (part.type === "memo") {
        const options = state.memos.map((memo) => {
          const selected = memo.id === part.memoId ? "selected" : "";
          return `<option value="${escapeAttr(memo.id)}" ${selected}>${escapeHtml(memo.title || "無題メモ")}</option>`;
        }).join("");
        return `
          <div class="field">
            <label>挿入するメモ</label>
            <select data-action="selectMemo">
              <option value="">メモを選択</option>
              ${options}
            </select>
          </div>
        `;
      }
      if (part.type === "text") {
        return `
          <div class="field">
            <label>テキストを記入</label>
            <textarea data-action="editText" placeholder="ここに追加したい文章を書いてください">${escapeHtml(part.text)}</textarea>
          </div>
        `;
      }
      return `<div class="status">追加したい内容を選んでください。</div>`;
    }

    function buildPromptText() {
      return promptParts.map((part) => {
        if (part.type === "memo") {
          const memo = state.memos.find((item) => item.id === part.memoId);
          if (!memo) return "";
          return `${memo.title || "無題メモ"}\n「${memo.body || ""}」`;
        }
        if (part.type === "text") {
          return part.text.trim();
        }
        return "";
      }).filter(Boolean).join("\n\n");
    }

    function showPromptOutput() {
      const text = buildPromptText();
      if (!text) {
        showToast("表示する内容がありません");
        return;
      }
      const outputWindow = window.open("", "promptOutputWindow", "width=900,height=720");
      if (outputWindow) {
        renderPromptWindow(outputWindow, text);
        return;
      }
      fields.promptOutputWrap.hidden = false;
      fields.promptOutput.value = text;
      fields.promptOutput.focus();
      showToast("別ウィンドウが開けなかったため、画面内に表示しました");
    }

    function renderPromptWindow(outputWindow, text) {
      const doc = outputWindow.document;
      doc.title = "作成プロンプト";
      doc.documentElement.lang = "ja";
      doc.head.innerHTML = "";
      doc.body.innerHTML = "";

      const metaCharset = doc.createElement("meta");
      metaCharset.setAttribute("charset", "utf-8");
      const metaViewport = doc.createElement("meta");
      metaViewport.setAttribute("name", "viewport");
      metaViewport.setAttribute("content", "width=device-width, initial-scale=1");
      doc.head.append(metaCharset, metaViewport);

      const style = doc.createElement("style");
      style.textContent = `
        * { box-sizing: border-box; }
        body {
          margin: 0;
          padding: 22px;
          background: #f5f7fb;
          color: #172033;
          font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
        }
        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          flex-wrap: wrap;
          margin-bottom: 14px;
        }
        h1 { margin: 0; font-size: 22px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
          border: 1px solid #dce2eb;
          border-radius: 8px;
          padding: 10px 14px;
          background: #fff;
          color: #172033;
          font: inherit;
          font-weight: 700;
          cursor: pointer;
        }
        .copy { border: 0; background: #101828; color: #fff; }
        textarea {
          width: 100%;
          min-height: calc(100vh - 105px);
          border: 1px solid #dce2eb;
          border-radius: 8px;
          padding: 16px;
          background: #fff;
          color: #172033;
          font: 16px/1.7 "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
          resize: vertical;
          white-space: pre-wrap;
        }
      `;
      doc.head.appendChild(style);

      const header = doc.createElement("header");
      const title = doc.createElement("h1");
      title.textContent = "作成プロンプト";
      const actions = doc.createElement("div");
      actions.className = "actions";
      const copyButton = doc.createElement("button");
      copyButton.className = "copy";
      copyButton.textContent = "そのままコピー";
      const downloadButton = doc.createElement("button");
      downloadButton.textContent = "txt保存";
      const closeButton = doc.createElement("button");
      closeButton.textContent = "閉じる";
      actions.append(copyButton, downloadButton, closeButton);
      header.append(title, actions);

      const textarea = doc.createElement("textarea");
      textarea.readOnly = true;
      textarea.value = text;
      doc.body.append(header, textarea);

      copyButton.addEventListener("click", async () => {
        await outputWindow.navigator.clipboard.writeText(text);
        copyButton.textContent = "コピー済み";
      });
      downloadButton.addEventListener("click", () => {
        downloadText(text);
      });
      closeButton.addEventListener("click", () => {
        outputWindow.close();
      });
      textarea.focus();
    }

    function downloadPromptText() {
      const text = fields.promptOutput.value || buildPromptText();
      if (!text) {
        showToast("保存する内容がありません");
        return;
      }
      downloadText(text);
    }

    function downloadText(text) {
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `prompt-${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function showToast(message) {
      fields.toast.textContent = message;
      fields.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => fields.toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    $("newMemo").addEventListener("click", addMemo);
    $("deleteMemo").addEventListener("click", deleteMemo);
    $("commitUpdate").addEventListener("click", commitActiveUpdate);
    $("copyAll").addEventListener("click", copyAll);
    $("copyBody").addEventListener("click", copyBody);
    $("addCategory").addEventListener("click", addCategory);
    $("toggleFilterCategoryAdd").addEventListener("click", () => {
      fields.filterCategoryAdd.hidden = !fields.filterCategoryAdd.hidden;
      if (!fields.filterCategoryAdd.hidden) fields.filterCategoryName.focus();
    });
    $("addFilterCategory").addEventListener("click", addFilterCategory);
    $("promptBuilderOpen").addEventListener("click", openPromptBuilder);
    $("promptBuilderClose").addEventListener("click", closePromptBuilder);
    $("promptExtend").addEventListener("click", addPromptPart);
    $("promptShowAll").addEventListener("click", showPromptOutput);
    $("promptCopy").addEventListener("click", () => copyText(fields.promptOutput.value || buildPromptText(), "プロンプトをコピーしました"));
    $("promptDownload").addEventListener("click", downloadPromptText);

    fields.promptBlocks.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const block = button.closest("[data-part-id]");
      const part = promptParts.find((item) => item.id === block.dataset.partId);
      if (!part) return;
      if (button.dataset.action === "memo") {
        part.type = "memo";
        part.memoId = activeId || "";
      }
      if (button.dataset.action === "text") {
        part.type = "text";
      }
      if (button.dataset.action === "remove") {
        promptParts = promptParts.filter((item) => item.id !== part.id);
      }
      renderPromptBuilder();
    });

    fields.promptBlocks.addEventListener("change", (event) => {
      const target = event.target.closest("[data-action='selectMemo']");
      if (!target) return;
      const block = target.closest("[data-part-id]");
      const part = promptParts.find((item) => item.id === block.dataset.partId);
      if (!part) return;
      part.memoId = target.value;
    });

    fields.promptBlocks.addEventListener("input", (event) => {
      const target = event.target.closest("[data-action='editText']");
      if (!target) return;
      const block = target.closest("[data-part-id]");
      const part = promptParts.find((item) => item.id === block.dataset.partId);
      if (!part) return;
      part.text = target.value;
    });

    fields.memoList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (!button) return;
      activeId = button.dataset.id;
      renderList();
      renderEditor();
    });

    fields.searchBox.addEventListener("input", renderList);
    fields.filterCategory.addEventListener("change", renderList);
    fields.sortMode.addEventListener("change", renderList);

    fields.titleInput.addEventListener("input", () => mutateActive({ title: fields.titleInput.value }));
    fields.descriptionInput.addEventListener("input", () => mutateActive({ description: fields.descriptionInput.value }));
    fields.bodyInput.addEventListener("input", () => mutateActive({ body: fields.bodyInput.value }));
    fields.categorySelect.addEventListener("change", () => mutateActive({ categoryId: fields.categorySelect.value }));

    renderAll();
  </script>
</body>
</html>
