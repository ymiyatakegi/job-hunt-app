<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>語句暗記トレーニング</title>
  <style>
    :root {
      --bg: #03b632;
      --surface: #f8e80a;
      --surface-2: #f0ce0a;
      --line: #0b7916;
      --text: #000000;
      --muted: #0f100f;
      --accent: #00b00c;
      --accent-2: #000000;
      --danger: #0e07f0;
      --ok: #ff0202;
      --shadow: 0 18px 38px rgba(31, 52, 65, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--text);
      background: radial-gradient(circle at 8% 0%, rgba(15,111,143,.16), transparent 30%), radial-gradient(circle at 96% 4%, rgba(22,128,95,.12), transparent 24%), linear-gradient(180deg,#f8fbfd 0%,var(--bg) 100%);
      font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
    }
    button {
      min-height: 44px;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-weight: 800;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    .ghost { color: var(--accent-2); background: rgba(15,111,143,.08); border-color: rgba(15,111,143,.2); }
    .ok { color: #fff; background: var(--ok); border-color: var(--ok); }
    .miss { color: #fff; background: var(--danger); border-color: var(--danger); }
    .danger { color: var(--danger); background: rgba(180,59,79,.08); border-color: rgba(180,59,79,.22); }
    .app { width: min(100%, 720px); margin: 0 auto; padding: 14px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .topbar, .panel, .card { border: 1px solid rgba(191,208,218,.86); border-radius: 8px; background: rgba(251,253,255,.96); box-shadow: var(--shadow); }
    .topbar { padding: 16px; margin-bottom: 12px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: .78rem; font-weight: 900; letter-spacing: .08em; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: clamp(1.35rem, 7vw, 2rem); line-height: 1.2; }
    h2 { margin-bottom: 10px; font-size: 1.06rem; }
    .muted { color: var(--muted); }
    .view { display: none; }
    .view.is-active { display: block; }
    .panel { padding: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat { min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #f6fafc; }
    .stat span { display: block; color: var(--muted); font-size: .72rem; font-weight: 900; }
    .stat strong { display: block; margin-top: 2px; font-size: 1.2rem; }
    .actions { display: grid; gap: 10px; margin-top: 14px; }
    .actions.two { grid-template-columns: 1fr 1fr; }
    .card { padding: 16px; }
    .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .86rem; font-weight: 800; }
    .word { display: grid; place-items: center; min-height: 210px; margin: 14px 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: center; }
    .word strong { overflow-wrap: anywhere; padding: 16px; font-size: clamp(2.25rem, 16vw, 4rem); line-height: 1.15; }
    .answer { display: none; gap: 12px; margin-top: 12px; }
    .answer.is-open { display: grid; }
    .answer-box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
    .answer-box span { display: block; margin-bottom: 6px; color: var(--muted); font-size: .78rem; font-weight: 900; }
    .answer-box p { margin: 0; line-height: 1.7; white-space: pre-wrap; }
    .judge { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .judge.is-open { display: grid; }
    .summary-list { display: grid; gap: 10px; margin: 14px 0; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; font-weight: 900; }
    .summary-row strong { font-size: 1.5rem; }
    .small { font-size: .84rem; line-height: 1.7; }
    @media (min-width: 560px) { .actions { grid-template-columns: 1fr 1fr; } .actions .wide { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <p class="eyebrow">VOCABULARY</p>
      <h1>語句暗記トレーニング</h1>
    </header>
    <section id="setupView" class="view is-active">
      <div class="panel">
        <h2>スタート</h2>
        <p class="muted small">単語だけを見て意味を思い出してから、答えを表示して自分で判定します。</p>
        <div id="setupStats" class="stats"></div>
        <div class="actions">
          <button id="startBtn" class="primary" type="button">スタート</button>
          <button id="resetBtn" class="danger" type="button">記録リセット</button>
        </div>
      </div>
    </section>
    <section id="quizView" class="view">
      <div class="card">
        <div class="meta"><span id="sourceText"></span><span id="queueText"></span></div>
        <div class="word"><strong id="wordText"></strong></div>
        <button id="showAnswerBtn" class="primary wide" type="button">答えを見る</button>
        <div id="answerArea" class="answer">
          <div class="answer-box"><span>覚えやすい意味</span><p id="meaningText"></p></div>
          <div class="answer-box"><span>セット例・補足</span><p id="exampleText"></p></div>
        </div>
        <div id="judgeArea" class="judge">
          <button id="missBtn" class="miss" type="button">×</button>
          <button id="okBtn" class="ok" type="button">○</button>
        </div>
        <div class="actions two">
          <button id="finishBtn" class="ghost" type="button">いったん終わる</button>
          <button id="skipBtn" type="button">あとで</button>
        </div>
      </div>
    </section>
    <section id="resultView" class="view">
      <div class="panel">
        <h2>今回の結果</h2>
        <div class="summary-list">
          <div class="summary-row"><span>○</span><strong id="okCount">0</strong></div>
          <div class="summary-row"><span>×</span><strong id="missCount">0</strong></div>
          <div class="summary-row"><span>未回答</span><strong id="unansweredCount">0</strong></div>
        </div>
        <p id="resultNote" class="muted small"></p>
        <div class="actions">
          <button id="restartBtn" class="primary" type="button">続きからスタート</button>
          <button id="homeBtn" class="ghost" type="button">最初の画面へ</button>
        </div>
      </div>
    </section>
  </main>

    const STORE_KEY = "vocabulary-practice-v1";
    const byNo = new Map(WORDS.map((item) => [item.no, item]));
    let progress = loadProgress();
    let session = null;
    const nodes = {
      setupView: document.getElementById("setupView"), quizView: document.getElementById("quizView"), resultView: document.getElementById("resultView"),
      setupStats: document.getElementById("setupStats"), startBtn: document.getElementById("startBtn"), resetBtn: document.getElementById("resetBtn"),
      sourceText: document.getElementById("sourceText"), queueText: document.getElementById("queueText"), wordText: document.getElementById("wordText"),
      showAnswerBtn: document.getElementById("showAnswerBtn"), answerArea: document.getElementById("answerArea"), meaningText: document.getElementById("meaningText"), exampleText: document.getElementById("exampleText"),
      judgeArea: document.getElementById("judgeArea"), missBtn: document.getElementById("missBtn"), okBtn: document.getElementById("okBtn"), finishBtn: document.getElementById("finishBtn"), skipBtn: document.getElementById("skipBtn"),
      okCount: document.getElementById("okCount"), missCount: document.getElementById("missCount"), unansweredCount: document.getElementById("unansweredCount"), resultNote: document.getElementById("resultNote"),

    };

    nodes.restartBtn.addEventListener("click", startSession);

    nodes.okBtn.addEventListener("click", () => judge(true));
    nodes.missBtn.addEventListener("click", () => judge(false));
    nodes.finishBtn.addEventListener("click", finishSession);
    nodes.skipBtn.addEventListener("click", skipCurrent);
    nodes.resetBtn.addEventListener("click", resetProgress);
    renderSetup();
    function startSession() {
      if (progress.done.length >= WORDS.length && progress.retry.length === 0) progress.done = [];
      session = { ok: 0, miss: 0, answered: new Set(), current: null, queue: buildQueue() };
      showView("quizView");
      nextQuestion();
    }
    function buildQueue() {
      const retry = progress.retry.filter((no) => byNo.has(no));
      const priorityRetry = shuffle(retry.filter((no) => (progress.words[no] && progress.words[no].streak) !== 1));
      const normalRetry = retry.filter((no) => progress.words[no] && progress.words[no].streak === 1);
      const done = new Set(progress.done);
      const retrySet = new Set(retry);
      const fresh = shuffle(WORDS.map((item) => item.no).filter((no) => !done.has(no) && !retrySet.has(no)));
      return priorityRetry.concat(shuffle(normalRetry.concat(fresh)));
    }
    function nextQuestion() {
      if (!session.queue.length) {
        if (progress.done.length >= WORDS.length && progress.retry.length === 0) progress.done = [];
        return finishSession();
      }
      if (!session.queue.length) return finishSession();
      session.current = session.queue.shift();
      const item = byNo.get(session.current);
      nodes.sourceText.textContent = item.source ? `${item.source} No.${item.no}` : `No.${item.no}`;
      nodes.queueText.textContent = `未回答 ${WORDS.length - session.answered.size}`;
      nodes.wordText.textContent = item.word;
      nodes.meaningText.textContent = item.meaning || "-";
      nodes.exampleText.textContent = item.example || "-";
      nodes.answerArea.classList.remove("is-open");
      nodes.judgeArea.classList.remove("is-open");
      nodes.showAnswerBtn.disabled = false;
    }
    function revealAnswer() {
      nodes.answerArea.classList.add("is-open");
      nodes.judgeArea.classList.add("is-open");
      nodes.showAnswerBtn.disabled = true;
    }
    function judge(isOk) {
      const no = session.current;
      const state = progress.words[no] || { streak: 0 };
      session.answered.add(no);
      removeFromQueue(no);
      if (isOk) {
        session.ok += 1;
        state.streak = Math.min(2, (state.streak || 0) + 1);
        if (!progress.retry.includes(no) || state.streak >= 2) {
          progress.retry = progress.retry.filter((item) => item !== no);
          progress.done = unique(progress.done.concat(no));
        }
      } else {
        session.miss += 1;
        state.streak = 0;
        progress.done = progress.done.filter((item) => item !== no);
        progress.retry = unique(progress.retry.concat(no));
      }
      progress.words[no] = state;
      saveProgress();
      renderSetup();
      nextQuestion();
    }
    function removeFromQueue(no) {
      if (!session || !session.queue) return;
      session.queue = session.queue.filter((item) => item !== no);
    }
    function skipCurrent() {
      if (session && session.current) session.queue.push(session.current);
      nextQuestion();
    }
    function finishSession() {
      if (!session) session = { ok: 0, miss: 0, answered: new Set() };
      nodes.okCount.textContent = session.ok;
      nodes.missCount.textContent = session.miss;
      nodes.unansweredCount.textContent = Math.max(0, WORDS.length - session.answered.size);
      nodes.resultNote.textContent = `復習中: ${progress.retry.length}語 / 1周の完了: ${progress.done.length}語 / 全${WORDS.length}語`;
      showView("resultView");
    }
    function renderSetup() {
      nodes.setupStats.innerHTML = `<div class="stat"><span>全語数</span><strong>${WORDS.length}</strong></div><div class="stat"><span>1周完了</span><strong>${progress.done.length}</strong></div><div class="stat"><span>復習中</span><strong>${progress.retry.length}</strong></div>`;
    }
    function resetProgress() {
      if (!confirm("記録をリセットしますか？")) return;
      progress = normalizeProgress(null);
      saveProgress();
      renderSetup();
    }
    function showView(id) {
      [nodes.setupView, nodes.quizView, nodes.resultView].forEach((node) => node.classList.toggle("is-active", node.id === id));
    }
    function loadProgress() {
      try { return normalizeProgress(JSON.parse(localStorage.getItem(STORE_KEY) || "null")); } catch { return normalizeProgress(null); }
    }
    function normalizeProgress(input) {
      const valid = new Set(WORDS.map((item) => item.no));
      const words = input && input.words && typeof input.words === "object" ? input.words : {};
      return {
        done: unique(Array.isArray(input && input.done) ? input.done : []).filter((no) => valid.has(no)),
        retry: unique(Array.isArray(input && input.retry) ? input.retry : []).filter((no) => valid.has(no)),
        words
      };
    }
    function saveProgress() { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
    function unique(values) { return [...new Set(values.map(Number).filter(Number.isFinite))]; }
    function shuffle(values) {
      const next = values.slice();
      for (let index = next.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [next[index], next[swap]] = [next[swap], next[index]];
      }
      return next;
    }
